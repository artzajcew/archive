{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" enctype="multipart/form-data" class="col-md-7">
    {% csrf_token %}{{ form.as_p }}
    <button class="btn btn-primary">Сохранить</button>
</form>
<p class="mt-3"><a href="{% url 'archive:folder_create' %}">Создать папку</a> · <a href="{% url 'archive:tag_create' %}">Создать тег</a></p>
{% endblock %}
