{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Личный архив{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'archive:home' %}">Личный архив</a>
        {% if user.is_authenticated %}
            <a class="btn btn-outline-light" href="{% url 'logout' %}">Выйти ({{ user.username }})</a>
        {% else %}
            <a class="btn btn-outline-light" href="{% url 'login' %}">Войти</a>
        {% endif %}
    </div>
</nav>
<main class="container">
    {% include "includes/messages.html" %}
    {% block content %}{% endblock %}
</main>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
