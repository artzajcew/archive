{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Мои документы{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="{% url 'archive:home' %}">Мои документы</a>
        {% if user.is_authenticated %}
            <div class="d-flex align-items-center gap-2">
                <a class="btn btn-outline-light" href="{% url 'archive:statistics' %}">Статистика</a>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-outline-light" type="submit">
                        Выйти ({{ user.username }})
                    </button>
                </form>
            </div>
        {% else %}
            <div>
                <a class="btn btn-outline-light" href="{% url 'login' %}">Войти</a>
            </div>
        {% endif %}
    </div>
</nav>
<main class="container">
    {% include "includes/messages.html" %}
    {% block content %}{% endblock %}
</main>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
